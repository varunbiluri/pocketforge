name: CI
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q
      - run: uv build
      - name: Exercise installed wheel across all examples
        run: |
          uv venv /tmp/pocketforge-wheel
          uv pip install --python /tmp/pocketforge-wheel/bin/python dist/*.whl
          /tmp/pocketforge-wheel/bin/python scripts/smoke_package.py
      - name: Exercise installed source distribution
        run: |
          uv venv /tmp/pocketforge-sdist
          uv pip install --python /tmp/pocketforge-sdist/bin/python dist/*.tar.gz
          /tmp/pocketforge-sdist/bin/python scripts/smoke_package.py

  neural:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra dev --extra neural
      - run: uv run --extra neural pytest tests/test_neural.py -q
        env:
          POCKETFORGE_NEURAL_TEST: '1'
